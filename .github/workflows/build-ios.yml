name: Build iOS on macOS

on: [workflow_dispatch]

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity Hub and Editor
        run: |
          brew install --cask unity-hub
          /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- --headless install --version 6000.6.7f1 --changeset auto --module ios --childModules

      - name: Build Xcode Project
        run: |
          /Applications/Unity/Hub/Editor/6000.6.7f1/Unity.app/Contents/MacOS/Unity \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -username "${{ secrets.UNITY_EMAIL }}" \
            -password "${{ secrets.UNITY_PASSWORD }}" \
            -buildTarget iOS \
            -executeMethod BuildScript.BuildiOS

      - name: Compile Unsigned IPA
        run: |
          cd build/iOS
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos build CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build
          mkdir -p Payload
          cp -r build/*.app Payload/
          zip -r game.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Game-IPA
          path: build/iOS/game.ipa
