name: Build iOS (Unsigned)

on: [workflow_dispatch]

jobs:
  buildForIOS:
    name: Build for iOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.7f1
          targetPlatform: iOS
          allowDirtyBuild: true

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: XcodeProject
          path: build/iOS

  compileIPA:
    needs: buildForIOS
    runs-on: macos-latest
    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: XcodeProject
          path: XcodeProject

      - name: Build Unsigned IPA
        run: |
          cd XcodeProject
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos build CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build
          mkdir -p Payload
          cp -r build/*.app Payload/
          zip -r game.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Game-IPA
          path: XcodeProject/game.ipa
